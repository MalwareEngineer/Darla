[build-system]
requires = ["setuptools>=75.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "darla"
version = "0.1.0"
description = "Phishing kit tracking and analysis platform"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer[all]>=0.15.0",
    "python-dotenv>=1.0.0",
    "stix2>=3.0.1",
    "python-multipart>=0.0.18",
    "rarfile>=4.2",
    "python-Levenshtein>=0.26.0",
    "cryptography>=43.0.0",
    "brotli>=1.1.0",
    # JWT validation for OIDC bearer tokens (RFC 0001).  PyJWT rather
    # than python-jose (sparsely maintained, CVE-2024-33663/33664) or
    # authlib (we only need the offline verifier) — the [crypto] extra
    # pulls the RS/PS/ES/EdDSA backends.
    "PyJWT[crypto]>=2.10.0",
    # YAML parser for the `darla-admin monitored-domain reload`
    # command (RFC §9).  Already a transitive dep of other libs but
    # we depend on it directly here so it can't disappear under us.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Async SQLite driver — used by the auth middleware tests to
    # exercise JIT user provisioning end-to-end without standing up
    # a Postgres dependency.
    "aiosqlite>=0.20.0",
]
tlsh = [
    "py-tlsh>=4.7.2",
]
yara = [
    "yara-python>=4.5.1",
]
qr = [
    "pyzbar>=0.1.9",
    "Pillow>=10.0.0",
]
browser = [
    "camoufox[geoip]>=0.4.0",
]
render = [
    # Artifact rendering (PDF page rasterization; DOCX goes through LibreOffice → PDF first)
    "pymupdf>=1.24.0",
]

[project.scripts]
darla = "darla.cli:app"
# Operator-facing admin CLI (RFC §9).  Runs inside the API container
# via SSM in prod; locally via `docker compose exec api darla-admin ...`
darla-admin = "darla.admin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Applied migrations are history: rewriting them for style buys nothing
# and risks changing what already ran.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One-off operator scripts: long report print()s and user-agent strings.
"scripts/*" = ["E501"]
# Embedded JavaScript shipped to the browser — not reflowed.
"src/darla/analysis/browser_downloader.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Typer parameter markers are declarative, evaluated once
# at import by design — not the mutable-default bug B008 targets.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header",
    "typer.Option", "typer.Argument",
]
